appId: com.markdown-maker.app
productName: Markdown Maker
copyright: Copyright © 2026 alanwangcanyi
npmRebuild: false
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - package.json
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown File
    role: Editor
  - ext: markdown
    name: Markdown
    description: Markdown File
    role: Editor
  - ext: txt
    name: Text
    description: Text File
    role: Editor
mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  target:
    - dmg
    - zip
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
